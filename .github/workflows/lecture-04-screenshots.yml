name: Lecture 4 screenshots

on:
  push:
    branches:
      - main
    paths:
      - 'examples/lecture-04-state-events-forms/**'
      - 'package.json'
      - '.github/workflows/lecture-04-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Lecture 4 example
        run: npm run build:04

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate screenshots from the running example
        run: npm run screenshots:04

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: lecture-04-screenshots
          path: screenshots/lecture-04/*.png
          if-no-files-found: error

      - name: Commit refreshed screenshots
        shell: bash
        run: |
          if git diff --quiet -- screenshots/lecture-04; then
            echo "Screenshots are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/lecture-04
          git commit -m "Refresh Lecture 4 screenshots"
          git push
