name: Course example screenshots

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'services/**'
      - 'package.json'
      - '.github/workflows/lecture-04-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots:03
      - run: npm run screenshots:04
      - run: npm run screenshots:05
      - run: npm run screenshots:06
      - run: npm run screenshots:07
      - run: npm run screenshots:08
      - run: npm run screenshots:09
      - uses: actions/upload-artifact@v4
        with:
          name: course-screenshots
          path: screenshots/lecture-*/*.png
          if-no-files-found: error
      - name: Commit refreshed screenshots
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- screenshots)" ]; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Refresh course example screenshots"
          git pull --rebase origin main
          git push
