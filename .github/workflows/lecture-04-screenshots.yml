name: Course example screenshots

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'services/**'
      - 'package.json'
      - '.github/workflows/lecture-04-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots:03
      - run: npm run screenshots:04
      - run: npm run screenshots:05
      - run: npm run screenshots:06
      - run: npm run screenshots:07
      - run: npm run screenshots:08
      - name: Download official DevTools reference screenshots
        shell: bash
        run: |
          mkdir -p screenshots/devtools
          curl -L --fail --retry 3 -o screenshots/devtools/react-components.png https://react.dev/images/docs/react-devtools-extension.png
          curl -L --fail --retry 3 -o screenshots/devtools/browser-network.png https://developer.chrome.com/static/docs/devtools/network/image/network-docked-bottom.png
          curl -L --fail --retry 3 -o screenshots/devtools/browser-network-headers.png https://developer.chrome.com/static/docs/devtools/network/image/the-headers-tab.png
          curl -L --fail --retry 3 -o screenshots/devtools/redux-state.png https://redux.js.org/assets/images/devtools-basic-counter-d37a7c78b6f2e1b29f9dd135128fe505.png
          curl -L --fail --retry 3 -o screenshots/devtools/react-native-sources.webp https://docs.expo.dev/static/images/debugging/inspector-sources-tab.webp
          curl -L --fail --retry 3 -o screenshots/devtools/react-native-components.webp https://docs.expo.dev/static/images/debugging/inspector-components.webp
          curl -L --fail --retry 3 -o screenshots/devtools/react-native-network.webp https://docs.expo.dev/static/images/debugging/inspector-network-post.webp
      - uses: actions/upload-artifact@v4
        with:
          name: course-screenshots
          path: |
            screenshots/lecture-*/*.png
            screenshots/devtools/*
          if-no-files-found: error
      - name: Commit refreshed screenshots
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- screenshots)" ]; then
            echo "Screenshots are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "Refresh course example screenshots"
          git pull --rebase origin main
          git push
