<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskApp – Лекція 1</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="app">
  <header><p class="eyebrow">Програмування інтерфейсів користувача · Лекція 1</p>
  <h1>TaskApp</h1>
  <p>Подія користувача → стан UI → HTTP API → результат.</p></header>
  <form id="task-form">
    <label for="task-title">Назва завдання</label>
    <div class="form-row"><input id="task-title" type="text" placeholder="Нове завдання" autocomplete="off">
    <button id="add-button" type="submit">Додати</button></div>
  </form>
  <p id="request-status" role="status" aria-live="polite">Підготовка…</p>
  <section aria-labelledby="tasks-heading">
    <div class="heading-row"><h2 id="tasks-heading">Завдання</h2><button id="clear-button" class="secondary" type="button">Очистити список локально</button></div>
    <ul id="task-list"></ul>
  </section>
  <p class="hint">У Browser DevTools → Network можна побачити GET і POST до /api/tasks.</p>
</main>
</body></html>
